project:
  id: soloship
  name: SoloShip
  repo: git@github.com:jueduizone/soloship.git
  default_context: production
contexts:
  production:
    risk: low
    secrets:
      vercel: soloship/vercel-token
      supabase-url: soloship/supabase-url
      supabase-anon-key: soloship/supabase-anon-key
      supabase-service-role-key: soloship/supabase-service-role-key
policy:
  allow:
    - gh issue list
    - npm run deploy:prod
    - vercel deploy
    - supabase db push
  require_confirm:
    - vercel deploy --prod
    - supabase db reset
  deny:
    - gh repo delete
